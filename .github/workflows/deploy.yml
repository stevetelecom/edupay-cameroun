name: 🚀 Deploy EduPay Cameroun

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to o2switch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_mysql, xml, bcmath, curl, zip

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install NPM dependencies & Build assets
        run: |
          npm install
          npm run build

      - name: Get runner public IP
        id: ip
        run: |
          IP=""
          for url in "https://api.ipify.org" "https://ifconfig.me/ip" "https://checkip.amazonaws.com"; do
            for attempt in 1 2 3; do
              IP=$(curl -s -m 10 "$url" || true)
              IP=$(echo "$IP" | tr -d '[:space:]')
              if [[ "$IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                break 2
              fi
              echo "Tentative $attempt sur $url a échoué, nouvel essai..."
              sleep 3
            done
          done
          if [[ -z "$IP" ]]; then
            echo "Impossible de récupérer l'IP publique du runner après plusieurs tentatives" >&2
            exit 1
          fi
          echo "ipv4=$IP" >> "$GITHUB_OUTPUT"
          echo "IP publique du runner : $IP"

      - name: Whitelist GitHub Actions IP on o2switch
        run: |
          curl -sm 45 -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
          "https://${{ secrets.CPANEL_SERVER }}:2083/execute/SshWhitelist/add?address=${{ steps.ip.outputs.ipv4 }}&port=22"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Sync files via rsync
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='storage/logs/' \
            --exclude='storage/framework/cache/' \
            --exclude='storage/framework/sessions/' \
            --exclude='storage/app/public/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p 22" \
            ./ ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:${{ secrets.DEPLOY_PATH }}

      - name: Post-deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -p 22 \
              ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} \
              "cd ${{ secrets.DEPLOY_PATH }} && \
               php artisan migrate --force && \
               php artisan config:cache && \
               php artisan route:cache && \
               php artisan view:cache"

      - name: Remove GitHub Actions IP from whitelist
        if: always()
        run: |
          curl -sm 45 -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
          "https://${{ secrets.CPANEL_SERVER }}:2083/execute/SshWhitelist/remove_all"
